<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рулетка Коллекция</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #0f172a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .app {
            max-width: 500px;
            width: 100%;
            background: #1e293b;
            border-radius: 32px;
            padding: 20px 16px 28px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            color: #f1f5f9;
        }
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            background: #0f172a;
            border-radius: 60px;
            padding: 6px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px 0;
            background: transparent;
            border: none;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 600;
            color: #94a3b8;
            cursor: pointer;
            transition: 0.2s;
        }
        .tab-btn.active {
            background: #3b82f6;
            color: white;
            box-shadow: 0 4px 12px rgba(59,130,246,0.3);
        }
        .tab-content {
            display: block;
        }
        .tab-content.hidden {
            display: none;
        }
        .main-number-panel {
            background: #0f172a;
            border-radius: 28px;
            padding: 18px 12px 16px;
            text-align: center;
            margin-bottom: 20px;
            position: relative;
        }
        .number-badge {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .current-number {
            font-size: 4.2rem;
            font-weight: 800;
            letter-spacing: 2px;
            line-height: 1;
        }
        .rarity-badge {
            font-size: 0.9rem;
            font-weight: 600;
            padding: 4px 16px;
            border-radius: 40px;
            background: #334155;
            color: #cbd5e1;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .roulette-container {
            background: #0f172a;
            border-radius: 24px;
            padding: 24px 8px 16px;
            margin-bottom: 16px;
            position: relative;
            overflow: hidden;
        }
        .roulette-wrapper {
            position: relative;
            overflow: hidden;
            margin: 0 4px;
            border-radius: 16px;
            background: #1e293b;
            padding: 8px 0;
        }
        .arrow-pointer {
            width: 0;
            height: 0;
            border-top: 15px solid #eab308;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            filter: drop-shadow(0 0 6px #eab30888);
        }
        .roulette-track {
            display: flex;
            gap: 6px;
            transition: transform 2.5s cubic-bezier(0.1, 0.8, 0.1, 1);
            will-change: transform;
            width: max-content;
            padding: 4px 0;
        }
        .roulette-card {
            min-width: 70px;
            height: 70px;
            background: #2d3b4f;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 700;
            color: #f8fafc;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            flex-shrink: 0;
            transition: 0.1s;
        }
        .roulette-card.operator {
            background: #334155;
            font-size: 1.6rem;
        }
        .controls {
            display: flex;
            gap: 12px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 12px 18px;
            border: none;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            background: #3b82f6;
            color: white;
            flex: 1;
            transition: 0.15s;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        .btn:active { transform: scale(0.96); }
        .btn:disabled { opacity: 0.5; pointer-events: none; }
        .btn-collect {
            background: #8b5cf6;
        }
        .btn-collect:disabled {
            opacity: 0.4;
        }
        .history-log {
            background: #0f172a;
            border-radius: 20px;
            padding: 12px 14px;
            margin-top: 16px;
            max-height: 150px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .log-item {
            padding: 6px 10px;
            border-left: 4px solid #94a3b8;
            background: #1e293b;
            border-radius: 8px;
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
        }
        .log-item .log-number { font-weight: 700; }
        .collection-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            aspect-ratio: 1/1;
            margin-top: 12px;
        }
        .collection-card {
            background: #1e293b;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.4rem;
            color: #f1f5f9;
            cursor: pointer;
            transition: 0.1s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            aspect-ratio: 1/1;
            border: 1px solid #334155;
        }
        .collection-card:active { transform: scale(0.94); }
        .filter-bar {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin: 8px 0 4px;
        }
        .filter-btn {
            background: #1e293b;
            border: none;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #cbd5e1;
            cursor: pointer;
            transition: 0.1s;
            flex: 1 0 auto;
        }
        .filter-btn.active {
            background: #3b82f6;
            color: white;
        }
        .empty-collection {
            grid-column: 1 / -1;
            text-align: center;
            color: #64748b;
            padding: 30px 0;
        }
        .glow-pulse {
            animation: mythicPulse 1.8s infinite alternate;
        }
        @keyframes mythicPulse {
            0% { text-shadow: 0 0 4px #ef4444, 0 0 12px #ef444488; }
            100% { text-shadow: 0 0 12px #ef4444, 0 0 30px #ef4444cc, 0 0 50px #ef444466; }
        }
        .rarity-common { color: #94a3b8; }
        .rarity-rare { color: #60a5fa; }
        .rarity-epic { color: #a78bfa; }
        .rarity-legendary { color: #fbbf24; }
        .rarity-mythic { color: #f87171; }
        .bg-rarity-common { background: #334155; }
        .bg-rarity-rare { background: #1e3a5f; }
        .bg-rarity-epic { background: #3b2d5e; }
        .bg-rarity-legendary { background: #5f4a1a; }
        .bg-rarity-mythic { background: #5f1a1a; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #0f172a; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 10px; }
    </style>
</head>
<body>
<div class="app" id="app">
    <div class="tabs">
        <button class="tab-btn active" data-tab="game">Игра</button>
        <button class="tab-btn" data-tab="collection">Коллекция</button>
    </div>

    <!-- Вкладка Игра -->
    <div id="tab-game" class="tab-content">
        <div class="main-number-panel">
            <div class="number-badge">
                <span class="current-number" id="displayNumber">1</span>
                <span class="rarity-badge" id="rarityBadge">Обычное</span>
            </div>
        </div>

        <!-- Рулетка А (операция) -->
        <div class="roulette-container" id="rouletteA">
            <div class="arrow-pointer"></div>
            <div class="roulette-wrapper">
                <div class="roulette-track" id="trackA"></div>
            </div>
        </div>

        <!-- Рулетка B (число) -->
        <div class="roulette-container" id="rouletteB">
            <div class="arrow-pointer"></div>
            <div class="roulette-wrapper">
                <div class="roulette-track" id="trackB"></div>
            </div>
        </div>

        <div class="controls">
            <button class="btn" id="spinBtn">🎲 Крутить</button>
            <button class="btn btn-collect" id="collectBtn">📥 В коллекцию</button>
        </div>

        <div class="history-log" id="historyLog">
            <div style="color:#64748b; text-align:center; font-size:0.8rem;">— История ходов —</div>
        </div>
    </div>

    <!-- Вкладка Коллекция -->
    <div id="tab-collection" class="tab-content hidden">
        <div class="filter-bar" id="filterBar">
            <button class="filter-btn active" data-filter="new">Сначала новые</button>
            <button class="filter-btn" data-filter="old">Сначала старые</button>
            <button class="filter-btn" data-filter="max">По убыванию (Max)</button>
            <button class="filter-btn" data-filter="min">По возрастанию (Min)</button>
            <button class="filter-btn" data-filter="rarity">По редкости</button>
        </div>
        <div class="collection-grid" id="collectionGrid"></div>
    </div>
</div>
<script>
    (function() {
        // ---------- CONFIG ----------
        const CARD_WIDTH = 70;
        const CARD_GAP = 6;
        const TOTAL_CARDS = 80;
        const WIN_INDEX = 69; // 70-я позиция (индекс 69)
        const OPERATORS = ['+', '−', '×', '÷'];

        // ---------- STATE ----------
        let currentNumber = 1;
        let collection = [];
        let history = [];
        let isSpinning = false;
        let spinPhase = 'idle'; // 'idle' | 'op' | 'num'
        let pendingOp = '+';
        let pendingNum = 1;
        let pendingResult = 1;

        // DOM refs
        const displayNumber = document.getElementById('displayNumber');
        const rarityBadge = document.getElementById('rarityBadge');
        const trackA = document.getElementById('trackA');
        const trackB = document.getElementById('trackB');
        const spinBtn = document.getElementById('spinBtn');
        const collectBtn = document.getElementById('collectBtn');
        const historyLog = document.getElementById('historyLog');
        const collectionGrid = document.getElementById('collectionGrid');
        const tabGame = document.getElementById('tab-game');
        const tabCollection = document.getElementById('tab-collection');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const tabBtns = document.querySelectorAll('.tab-btn');

        // ---------- UTILITY ----------
        function getRarity(num) {
            if (num === 777 || num === 666 || (num % 11 === 0 && num > 100)) return 'mythic';
            if (num > 500 || num === 999) return 'legendary';
            if (num > 150) return 'epic';
            if (num > 50) return 'rare';
            return 'common';
        }

        function rarityLabel(r) {
            const map = { common:'Обычное', rare:'Редкое', epic:'Эпическое', legendary:'Легендарное', mythic:'Мифическое' };
            return map[r] || 'Обычное';
        }

        function rarityColor(r) {
            const map = { common:'#94a3b8', rare:'#60a5fa', epic:'#a78bfa', legendary:'#fbbf24', mythic:'#f87171' };
            return map[r] || '#94a3b8';
        }

        function getRarityClass(r) {
            return 'rarity-' + r;
        }

        function getBgRarityClass(r) {
            return 'bg-rarity-' + r;
        }

        function isMythic(r) { return r === 'mythic'; }

        // ---------- LOCAL STORAGE ----------
        function saveState() {
            localStorage.setItem('roulette_number', JSON.stringify(currentNumber));
            localStorage.setItem('roulette_collection', JSON.stringify(collection));
            localStorage.setItem('roulette_history', JSON.stringify(history.slice(0,20)));
        }

        function loadState() {
            try {
                const n = localStorage.getItem('roulette_number');
                if (n !== null) currentNumber = JSON.parse(n);
                const c = localStorage.getItem('roulette_collection');
                if (c !== null) collection = JSON.parse(c);
                const h = localStorage.getItem('roulette_history');
                if (h !== null) history = JSON.parse(h);
            } catch(e) {}
            if (!Array.isArray(collection)) collection = [];
            if (!Array.isArray(history)) history = [];
            if (typeof currentNumber !== 'number' || isNaN(currentNumber)) currentNumber = 1;
            history = history.slice(0,20);
        }

        // ---------- RENDER UI ----------
        function renderNumber() {
            const r = getRarity(currentNumber);
            displayNumber.textContent = currentNumber;
            rarityBadge.textContent = rarityLabel(r);
            rarityBadge.className = 'rarity-badge ' + getRarityClass(r);
            if (isMythic(r)) {
                displayNumber.classList.add('glow-pulse');
            } else {
                displayNumber.classList.remove('glow-pulse');
            }
        }

        function renderHistory() {
            historyLog.innerHTML = '';
            if (history.length === 0) {
                historyLog.innerHTML = '<div style="color:#64748b; text-align:center; font-size:0.8rem;">— История ходов —</div>';
                return;
            }
            history.slice().reverse().forEach(item => {
                const div = document.createElement('div');
                div.className = 'log-item';
                const r = getRarity(item);
                div.style.borderLeftColor = rarityColor(r);
                div.innerHTML = `<span>${item}</span><span class="log-number ${getRarityClass(r)}">${rarityLabel(r)}</span>`;
                historyLog.appendChild(div);
            });
        }

        function renderCollection() {
            const filter = document.querySelector('.filter-btn.active')?.dataset.filter || 'new';
            let sorted = [...collection];
            if (filter === 'new') sorted = sorted.reverse();
            else if (filter === 'old') sorted = sorted;
            else if (filter === 'max') sorted.sort((a,b) => b - a);
            else if (filter === 'min') sorted.sort((a,b) => a - b);
            else if (filter === 'rarity') {
                const order = { mythic:0, legendary:1, epic:2, rare:3, common:4 };
                sorted.sort((a,b) => (order[getRarity(a)] || 5) - (order[getRarity(b)] || 5));
            }
            collectionGrid.innerHTML = '';
            if (sorted.length === 0) {
                collectionGrid.innerHTML = '<div class="empty-collection">Коллекция пуста</div>';
                return;
            }
            sorted.forEach(num => {
                const r = getRarity(num);
                const card = document.createElement('div');
                card.className = `collection-card ${getBgRarityClass(r)}`;
                card.textContent = num;
                card.style.color = rarityColor(r);
                card.addEventListener('click', () => {
                    currentNumber = num;
                    renderNumber();
                    saveState();
                    switchTab('game');
                });
                collectionGrid.appendChild(card);
            });
        }

        function switchTab(tabId) {
            tabBtns.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tab === tabId);
            });
            tabGame.classList.toggle('hidden', tabId !== 'game');
            tabCollection.classList.toggle('hidden', tabId !== 'collection');
            if (tabId === 'collection') renderCollection();
        }

        // ---------- ROULETTE LOGIC ----------
        function buildTrack(container, items, isOperator = false) {
            container.innerHTML = '';
            items.forEach(val => {
                const card = document.createElement('div');
                card.className = `roulette-card ${isOperator ? 'operator' : ''}`;
                card.textContent = val;
                container.appendChild(card);
            });
        }

        function getTranslateX(winIndex) {
            const containerWidth = document.querySelector('.roulette-wrapper')?.offsetWidth || 300;
            const totalWidth = (CARD_WIDTH + CARD_GAP) * winIndex + CARD_WIDTH/2;
            const centerOffset = containerWidth / 2;
            return - (totalWidth - centerOffset);
        }

        function generateCards(operator, num) {
            // 80 карточек, на позиции 69 — выигрыш
            const cards = [];
            // операторная лента
            if (operator) {
                for (let i = 0; i < TOTAL_CARDS; i++) {
                    if (i === WIN_INDEX) cards.push(operator);
                    else {
                        const randOp = OPERATORS[Math.floor(Math.random() * OPERATORS.length)];
                        cards.push(randOp);
                    }
                }
                return cards;
            } else {
                // числовая лента
                for (let i = 0; i < TOTAL_CARDS; i++) {
                    if (i === WIN_INDEX) cards.push(num);
                    else {
                        const rand = Math.floor(Math.random() * 200) + 1;
                        cards.push(rand);
                    }
                }
                return cards;
            }
        }

        function resetTracks() {
            trackA.style.transition = 'none';
            trackB.style.transition = 'none';
            trackA.style.transform = 'translateX(0px)';
            trackB.style.transform = 'translateX(0px)';
            // force reflow
            void trackA.offsetHeight;
            void trackB.offsetHeight;
        }

        function spinRoulette() {
            if (isSpinning) return;
            isSpinning = true;
            spinBtn.disabled = true;
            collectBtn.disabled = true;
            spinPhase = 'op';

            // 1. выбрать операцию и число
            const op = OPERATORS[Math.floor(Math.random() * OPERATORS.length)];
            const num = Math.floor(Math.random() * 50) + 1; // 1..50
            pendingOp = op;
            pendingNum = num;

            // вычислить результат
            let result = currentNumber;
            switch(op) {
                case '+': result = currentNumber + num; break;
                case '−': result = currentNumber - num; break;
                case '×': result = currentNumber * num; break;
                case '÷': result = Math.floor(currentNumber / num); break;
            }
            if (result < 1) result = 1;
            pendingResult = result;

            // 2. сбросить ленты без анимации
            resetTracks();

            // 3. сгенерировать ленты с выигрышным элементом на 69
            const opCards = generateCards(op, null);
            const numCards = generateCards(null, num);

            buildTrack(trackA, opCards, true);
            buildTrack(trackB, numCards, false);

            // 4. установить анимацию
            const translateA = getTranslateX(WIN_INDEX);
            const translateB = getTranslateX(WIN_INDEX);

            // Включить transition
            trackA.style.transition = 'transform 2.5s cubic-bezier(0.1, 0.8, 0.1, 1)';
            trackB.style.transition = 'transform 2.5s cubic-bezier(0.1, 0.8, 0.1, 1)';

            // 5. анимировать А
            trackA.style.transform = `translateX(${translateA}px)`;

            // по окончании А -> старт Б
            const onAEnd = () => {
                trackA.removeEventListener('transitionend', onAEnd);
                spinPhase = 'num';
                trackB.style.transform = `translateX(${translateB}px)`;
                // по окончании Б -> финал
                const onBEnd = () => {
                    trackB.removeEventListener('transitionend', onBEnd);
                    // финал
                    currentNumber = pendingResult;
                    renderNumber();
                    // добавить в историю
                    history.push(currentNumber);
                    if (history.length > 20) history.shift();
                    renderHistory();
                    saveState();
                    isSpinning = false;
                    spinBtn.disabled = false;
                    collectBtn.disabled = false;
                    spinPhase = 'idle';
                    // проверить дубликат для кнопки коллекции
                    updateCollectButton();
                };
                trackB.addEventListener('transitionend', onBEnd);
            };
            trackA.addEventListener('transitionend', onAEnd);
        }

        function updateCollectButton() {
            if (collection.includes(currentNumber)) {
                collectBtn.disabled = true;
                collectBtn.textContent = '⚠️ Уже в коллекции';
            } else {
                collectBtn.disabled = false;
                collectBtn.textContent = '📥 В коллекцию';
            }
        }

        // ---------- COLLECT ----------
        function collectNumber() {
            if (collection.includes(currentNumber)) {
                // ошибка в лог
                const errDiv = document.createElement('div');
                errDiv.className = 'log-item';
                errDiv.style.borderLeftColor = '#ef4444';
                errDiv.innerHTML = `<span>⚠️ Число уже сохранено!</span><span>${currentNumber}</span>`;
                historyLog.prepend(errDiv);
                if (historyLog.children.length > 20) historyLog.removeChild(historyLog.lastChild);
                return;
            }
            collection.push(currentNumber);
            saveState();
            renderCollection();
            updateCollectButton();
            // добавить в лог успех
            const okDiv = document.createElement('div');
            okDiv.className = 'log-item';
            const r = getRarity(currentNumber);
            okDiv.style.borderLeftColor = rarityColor(r);
            okDiv.innerHTML = `<span>✅ Сохранено</span><span class="${getRarityClass(r)}">${currentNumber}</span>`;
            historyLog.prepend(okDiv);
            if (historyLog.children.length > 20) historyLog.removeChild(historyLog.lastChild);
        }

        // ---------- INIT ----------
        function init() {
            loadState();
            renderNumber();
            renderHistory();
            renderCollection();
            updateCollectButton();

            // начальные ленты (заполним)
            const initOp = OPERATORS[Math.floor(Math.random() * OPERATORS.length)];
            const initNum = Math.floor(Math.random() * 50) + 1;
            const opCards = generateCards(initOp, null);
            const numCards = generateCards(null, initNum);
            buildTrack(trackA, opCards, true);
            buildTrack(trackB, numCards, false);
            resetTracks();
            // сдвиг на 69
            const translate = getTranslateX(WIN_INDEX);
            trackA.style.transition = 'none';
            trackB.style.transition = 'none';
            trackA.style.transform = `translateX(${translate}px)`;
            trackB.style.transform = `translateX(${translate}px)`;

            // события
            spinBtn.addEventListener('click', spinRoulette);
            collectBtn.addEventListener('click', collectNumber);

            tabBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    switchTab(btn.dataset.tab);
                });
            });

            filterBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    filterBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    renderCollection();
                });
            });

            // обновление кнопки коллекции при изменении числа
            // уже через renderNumber
        }

        // переопределим renderNumber для обновления кнопки
        const origRender = renderNumber;
        renderNumber = function() {
            origRender();
            updateCollectButton();
        };

        init();
    })();
</script>
</body>
</html>
