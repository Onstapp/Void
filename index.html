<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>...</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    overflow:hidden;
    background:#050510;
    color:white;
}

canvas{
    position:fixed;
    inset:0;
}

#center{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    text-align:center;
}

h1{
    font-size:60px;
    letter-spacing:10px;
    transition:.5s;
}

p{
    opacity:.6;
    margin-top:15px;
}

button{
    margin-top:35px;
    padding:14px 30px;
    border:none;
    border-radius:50px;
    background:white;
    color:black;
    cursor:pointer;
    font-size:18px;
    transition:.3s;
}

button:hover{
    transform:scale(1.08);
}

#message{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:40px;
    text-align:center;
    background:black;
    opacity:0;
    pointer-events:none;
    transition:1s;
    padding:30px;
}

#message.show{
    opacity:1;
}

.hidden{
    display:none;
}
</style>

</head>
<body>

<canvas id="stars"></canvas>

<div id="center">
<h1 id="title">НЕ НАЖИМАЙ</h1>
<p>Иногда любопытство меняет всё.</p>
<button id="btn">Нажать</button>
</div>

<div id="message"></div>

<script>
const canvas=document.getElementById("stars");
const ctx=canvas.getContext("2d");

function resize(){
canvas.width=innerWidth;
canvas.height=innerHeight;
}
resize();
onresize=resize;

const stars=[];

for(let i=0;i<700;i++){
stars.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
z:Math.random()*canvas.width
});
}

function draw(){
ctx.fillStyle="#050510";
ctx.fillRect(0,0,canvas.width,canvas.height);

for(let s of stars){

s.z-=3;

if(s.z<=0){
s.x=Math.random()*canvas.width;
s.y=Math.random()*canvas.height;
s.z=canvas.width;
}

let k=128/s.z;

let x=(s.x-canvas.width/2)*k+canvas.width/2;
let y=(s.y-canvas.height/2)*k+canvas.height/2;

let size=(1-k)*4;

ctx.fillStyle="white";
ctx.beginPath();
ctx.arc(x,y,size,0,Math.PI*2);
ctx.fill();
}

requestAnimationFrame(draw);
}
draw();

let clicks=0;

const btn=document.getElementById("btn");
const title=document.getElementById("title");
const msg=document.getElementById("message");

const texts=[
"Я же предупреждал.",
"Поздно останавливаться.",
"Ещё немного...",
"Ты действительно любопытный.",
"Теперь смотри внимательно..."
];

btn.onclick=()=>{

clicks++;

title.textContent=texts[Math.min(clicks-1,texts.length-1)];

document.body.style.filter=`hue-rotate(${clicks*60}deg)`;

if(clicks>=5){

document.querySelector("#center").classList.add("hidden");

let seconds=5;

msg.classList.add("show");

const timer=setInterval(()=>{

msg.innerHTML=`<div>
<div style="font-size:70px">${seconds}</div>
<div style="margin-top:15px;font-size:24px;opacity:.7">
Не закрывай страницу...
</div>
</div>`;

seconds--;

if(seconds<0){

clearInterval(timer);

document.body.style.background="white";
document.body.style.filter="none";

msg.style.background="white";
msg.style.color="black";

msg.innerHTML=`
<div>
<h1>🎉 Сюрприз!</h1>
<p style="margin-top:20px;font-size:24px">
Иногда самая интересная часть сайта — это ожидание того,
что сейчас случится.
</p>
<p style="margin-top:30px;font-size:18px;color:#666">
Спасибо, что дошёл до конца :)
</p>
</div>`;
}

},1000);

}

};

</script>

</body>
</html>
