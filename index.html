<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Number Collector — Карточная игра</title>
    <style>
        /* ===== RESET & GLOBAL ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        :root {
            --bg-dark: #0b0e1a;
            --card-bg: #141a2b;
            --gold: #f7d44a;
            --shadow: 0 8px 40px rgba(0, 0, 0, 0.8);
        }

        body {
            font-family: 'Orbitron', sans-serif;
            background: var(--bg-dark);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: radial-gradient(ellipse at 30% 50%, #1a2340 0%, #0b0e1a 70%);
            padding: 16px;
            user-select: none;
            overflow-x: hidden;
        }

        /* ===== ГЛАВНЫЙ КОНТЕЙНЕР ===== */
        .game-container {
            width: 100%;
            max-width: 1200px;
            background: rgba(20, 26, 43, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 28px 32px 38px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.04);
            transition: all 0.3s;
        }

        /* ===== ШАПКА ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 18px;
            margin-bottom: 24px;
        }

        .logo {
            font-size: 28px;
            font-weight: 900;
            background: linear-gradient(135deg, #f7d44a, #f9a825);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(247, 212, 74, 0.3);
            letter-spacing: 2px;
        }

        .logo span {
            font-weight: 400;
            font-size: 14px;
            -webkit-text-fill-color: rgba(255, 255, 255, 0.4);
            margin-left: 8px;
        }

        .stats {
            display: flex;
            gap: 28px;
            flex-wrap: wrap;
        }

        .stat-item {
            text-align: center;
            background: rgba(0, 0, 0, 0.35);
            padding: 6px 18px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .stat-item .label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.35);
        }

        .stat-item .value {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            line-height: 1.2;
        }

        .stat-item .value.gold {
            color: var(--gold);
        }

        /* ===== ПРОГРЕСС-БАР ===== */
        .progress-wrapper {
            margin-bottom: 30px;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 6px;
        }

        .progress-track {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            border-radius: 20px;
            background: linear-gradient(90deg, #f7d44a, #f9a825, #ff6f00);
            box-shadow: 0 0 30px rgba(247, 212, 74, 0.25);
            transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* ===== КНОПКА ОТКРЫТИЯ ===== */
        .pack-btn-wrap {
            display: flex;
            justify-content: center;
            margin-bottom: 34px;
        }

        .pack-btn {
            position: relative;
            background: linear-gradient(135deg, #2a3a6a, #1a2340);
            border: none;
            padding: 18px 60px;
            border-radius: 80px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 20px;
            color: #fff;
            letter-spacing: 3px;
            cursor: pointer;
            box-shadow: 0 8px 0 #0b0e1a, 0 12px 40px rgba(0, 0, 0, 0.6);
            transition: all 0.08s linear;
            text-transform: uppercase;
            border: 1px solid rgba(255, 255, 255, 0.08);
            overflow: hidden;
        }

        .pack-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), transparent 60%);
            pointer-events: none;
        }

        .pack-btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #0b0e1a, 0 8px 30px rgba(0, 0, 0, 0.6);
        }

        .pack-btn:disabled {
            opacity: 0.3;
            transform: translateY(4px);
            box-shadow: 0 4px 0 #0b0e1a;
            pointer-events: none;
        }

        .pack-btn .price-tag {
            font-size: 14px;
            font-weight: 400;
            color: var(--gold);
            margin-left: 12px;
        }

        /* ===== КАРТОЧКИ (3 шт) ===== */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 32px;
            min-height: 320px;
        }

        .card-slot {
            aspect-ratio: 5 / 7;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 24px;
            border: 1px dashed rgba(255, 255, 255, 0.06);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.3s;
            position: relative;
            perspective: 800px;
        }

        .card-slot .placeholder {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.1);
            letter-spacing: 2px;
        }

        /* ===== КАРТА (индивидуальная) ===== */
        .card {
            width: 100%;
            height: 100%;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 12px;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
                box-shadow 0.4s ease;
            transform-style: preserve-3d;
            animation: cardAppear 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            opacity: 0;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .card.reveal {
            opacity: 1;
        }

        .card .number {
            font-size: 68px;
            font-weight: 900;
            line-height: 1;
            text-shadow: 0 4px 30px rgba(0, 0, 0, 0.7);
            z-index: 2;
            position: relative;
        }

        .card .stars {
            font-size: 22px;
            letter-spacing: 4px;
            margin-top: 6px;
            z-index: 2;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        .card .rarity-label {
            position: absolute;
            bottom: 14px;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 3px;
            opacity: 0.6;
            background: rgba(0, 0, 0, 0.4);
            padding: 4px 16px;
            border-radius: 40px;
            backdrop-filter: blur(4px);
            z-index: 2;
        }

        /* ===== ЦВЕТА РЕДКОСТИ ===== */
        .rarity-common {
            background: linear-gradient(145deg, #3a3f4a, #2a2e38);
            border-color: rgba(180, 180, 190, 0.2);
        }
        .rarity-common .number {
            color: #b0b5c0;
        }
        .rarity-common .stars {
            color: #b0b5c0;
        }

        .rarity-rare {
            background: linear-gradient(145deg, #1e4a2a, #0f2a18);
            border-color: rgba(46, 204, 113, 0.2);
            box-shadow: 0 0 50px rgba(46, 204, 113, 0.15);
        }
        .rarity-rare .number {
            color: #2ecc71;
        }
        .rarity-rare .stars {
            color: #2ecc71;
        }

        .rarity-epic {
            background: linear-gradient(145deg, #1a2a5a, #0c1840);
            border-color: rgba(52, 152, 219, 0.2);
            box-shadow: 0 0 60px rgba(52, 152, 219, 0.15);
        }
        .rarity-epic .number {
            color: #3498db;
        }
        .rarity-epic .stars {
            color: #3498db;
        }

        .rarity-legendary {
            background: linear-gradient(145deg, #4a3a0a, #2a2000);
            border-color: rgba(241, 196, 15, 0.25);
            box-shadow: 0 0 80px rgba(241, 196, 15, 0.2);
            animation: legendaryPulse 2s ease-in-out infinite;
        }
        .rarity-legendary .number {
            color: #f1c40f;
        }
        .rarity-legendary .stars {
            color: #f1c40f;
        }

        .rarity-mythic {
            background: linear-gradient(145deg, #4a0a1a, #2a0008);
            border-color: rgba(231, 76, 60, 0.25);
            box-shadow: 0 0 90px rgba(231, 76, 60, 0.2);
            animation: mythicPulse 1.6s ease-in-out infinite;
        }
        .rarity-mythic .number {
            color: #e74c3c;
        }
        .rarity-mythic .stars {
            color: #e74c3c;
        }

        .rarity-cosmic {
            background: linear-gradient(145deg, #2a0a3a, #14001f);
            border-color: rgba(155, 89, 182, 0.3);
            box-shadow: 0 0 120px rgba(155, 89, 182, 0.25);
            animation: cosmicPulse 1.2s ease-in-out infinite;
        }
        .rarity-cosmic .number {
            color: #bb77dd;
            text-shadow: 0 0 40px rgba(155, 89, 182, 0.6);
        }
        .rarity-cosmic .stars {
            color: #bb77dd;
        }

        /* ===== АНИМАЦИИ ===== */
        @keyframes cardAppear {
            0% {
                opacity: 0;
                transform: rotateY(-90deg) scale(0.6) translateZ(-200px);
            }
            100% {
                opacity: 1;
                transform: rotateY(0deg) scale(1) translateZ(0);
            }
        }

        @keyframes legendaryPulse {
            0%,
            100% {
                box-shadow: 0 0 60px rgba(241, 196, 15, 0.15);
            }
            50% {
                box-shadow: 0 0 100px rgba(241, 196, 15, 0.35);
            }
        }

        @keyframes mythicPulse {
            0%,
            100% {
                box-shadow: 0 0 70px rgba(231, 76, 60, 0.15);
            }
            50% {
                box-shadow: 0 0 120px rgba(231, 76, 60, 0.4);
            }
        }

        @keyframes cosmicPulse {
            0%,
            100% {
                box-shadow: 0 0 80px rgba(155, 89, 182, 0.2);
                transform: scale(1);
            }
            50% {
                box-shadow: 0 0 160px rgba(155, 89, 182, 0.5);
                transform: scale(1.02);
            }
        }

        /* ===== ПАРТИКЛЫ (звёздный дождь при открытии) ===== */
        .particle-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--gold);
            box-shadow: 0 0 12px var(--gold);
            animation: particleFly 1.2s ease-out forwards;
        }

        @keyframes particleFly {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(0);
            }
        }

        /* ===== КОЛЛЕКЦИЯ (вкладки) ===== */
        .tabs {
            display: flex;
            gap: 12px;
            margin: 28px 0 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 12px;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.3);
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            padding: 6px 18px;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .tab-btn.active {
            color: #fff;
            background: rgba(255, 255, 255, 0.06);
        }

        .tab-btn:hover {
            color: rgba(255, 255, 255, 0.6);
        }

        .collection-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
            gap: 10px;
            max-height: 320px;
            overflow-y: auto;
            padding-right: 6px;
        }

        .collection-grid::-webkit-scrollbar {
            width: 4px;
        }
        .collection-grid::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
        }
        .collection-grid::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
        }

        .collection-item {
            aspect-ratio: 1 / 1;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: all 0.25s;
            cursor: default;
            position: relative;
        }

        .collection-item.found {
            background: rgba(255, 255, 255, 0.07);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.02);
        }

        .collection-item.found::after {
            content: '';
            position: absolute;
            inset: 2px;
            border-radius: 12px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05), transparent);
            pointer-events: none;
        }

        .collection-item .star-mini {
            position: absolute;
            bottom: 2px;
            right: 6px;
            font-size: 8px;
            color: var(--gold);
            opacity: 0.6;
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 700px) {
            .game-container {
                padding: 16px;
            }
            .cards-grid {
                grid-template-columns: 1fr 1fr 1fr;
                gap: 10px;
                min-height: 200px;
            }
            .card .number {
                font-size: 38px;
            }
            .card .stars {
                font-size: 14px;
            }
            .pack-btn {
                padding: 14px 32px;
                font-size: 16px;
            }
            .header {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }
            .stats {
                justify-content: space-around;
            }
            .collection-grid {
                grid-template-columns: repeat(auto-fill, minmax(44px, 1fr));
                max-height: 200px;
            }
            .collection-item {
                font-size: 12px;
            }
            .logo {
                font-size: 20px;
                text-align: center;
            }
        }

        @media (max-width: 480px) {
            .cards-grid {
                grid-template-columns: 1fr 1fr 1fr;
                gap: 6px;
                min-height: 140px;
            }
            .card .number {
                font-size: 26px;
            }
            .card .stars {
                font-size: 10px;
                letter-spacing: 2px;
            }
            .card .rarity-label {
                font-size: 7px;
                bottom: 6px;
                padding: 2px 10px;
            }
            .pack-btn {
                font-size: 13px;
                padding: 12px 20px;
            }
            .stat-item .value {
                font-size: 16px;
            }
            .stat-item .label {
                font-size: 8px;
            }
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- ШАПКА -->
        <div class="header">
            <div class="logo">
                ⟡ NUMBER COLLECTOR
                <span>v0.1</span>
            </div>
            <div class="stats">
                <div class="stat-item">
                    <div class="label">Монеты</div>
                    <div class="value gold" id="coinsDisplay">1 000</div>
                </div>
                <div class="stat-item">
                    <div class="label">Коллекция</div>
                    <div class="value" id="collectionCount">0 / 100</div>
                </div>
            </div>
        </div>

        <!-- ПРОГРЕСС -->
        <div class="progress-wrapper">
            <div class="progress-label">
                <span>Прогресс</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <!-- КНОПКА ПАКА -->
        <div class="pack-btn-wrap">
            <button class="pack-btn" id="packBtn">
                🎴 Открыть пак
                <span class="price-tag">⚡ 100</span>
            </button>
        </div>

        <!-- 3 КАРТЫ -->
        <div class="cards-grid" id="cardsGrid">
            <div class="card-slot" id="slot0"><span class="placeholder">✦</span></div>
            <div class="card-slot" id="slot1"><span class="placeholder">✦</span></div>
            <div class="card-slot" id="slot2"><span class="placeholder">✦</span></div>
        </div>

        <!-- ВКЛАДКИ: КОЛЛЕКЦИЯ -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="collection">Коллекция</button>
            <button class="tab-btn" data-tab="stats">Статистика</button>
        </div>

        <div class="collection-grid" id="collectionGrid"></div>
    </div>

    <!-- КОНТЕЙНЕР ДЛЯ ПАРТИКЛОВ -->
    <div class="particle-container" id="particleContainer"></div>

    <script>
        // ============================================================
        //  ДАННЫЕ
        // ============================================================
        const RARITY_CONFIG = [
            { name: 'Обычная', min: 1, max: 20, chance: 0.50, css: 'rarity-common', color: '#b0b5c0' },
            { name: 'Редкая', min: 21, max: 40, chance: 0.25, css: 'rarity-rare', color: '#2ecc71' },
            { name: 'Эпическая', min: 41, max: 60, chance: 0.13, css: 'rarity-epic', color: '#3498db' },
            { name: 'Легендарная', min: 61, max: 80, chance: 0.07, css: 'rarity-legendary', color: '#f1c40f' },
            { name: 'Мифическая', min: 81, max: 95, chance: 0.04, css: 'rarity-mythic', color: '#e74c3c' },
            { name: 'Космическая', min: 96, max: 100, chance: 0.01, css: 'rarity-cosmic', color: '#bb77dd' },
        ];

        const STAR_CONFIG = [
            { stars: 1, chance: 0.45 },
            { stars: 2, chance: 0.25 },
            { stars: 3, chance: 0.15 },
            { stars: 4, chance: 0.08 },
            { stars: 5, chance: 0.04 },
            { stars: 6, chance: 0.02 },
            { stars: 7, chance: 0.01 },
        ];

        // ============================================================
        //  СОСТОЯНИЕ
        // ============================================================
        let coins = 1000;
        let collection = {}; // key: number (1-100) => { stars: 0..7, found: bool }
        let cardHistory = []; // для последних 3 карт

        // Инициализируем коллекцию (все числа от 1 до 100)
        for (let i = 1; i <= 100; i++) {
            collection[i] = { found: false, stars: 0 };
        }

        // ============================================================
        //  DOM-ССЫЛКИ
        // ============================================================
        const coinsDisplay = document.getElementById('coinsDisplay');
        const collectionCount = document.getElementById('collectionCount');
        const progressPercent = document.getElementById('progressPercent');
        const progressFill = document.getElementById('progressFill');
        const packBtn = document.getElementById('packBtn');
        const slots = [document.getElementById('slot0'), document.getElementById('slot1'), document.getElementById('slot2')];
        const collectionGrid = document.getElementById('collectionGrid');
        const particleContainer = document.getElementById('particleContainer');

        // ============================================================
        //  ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
        // ============================================================
        function randomFloat() { return Math.random(); }

        function pickRandom(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function weightedPick(choices) {
            // choices: [{ chance, ... }, ...]
            let r = randomFloat();
            let cumulative = 0;
            for (let item of choices) {
                cumulative += item.chance;
                if (r <= cumulative) return item;
            }
            return choices[choices.length - 1];
        }

        function clamp(v, min, max) { return Math.min(max, Math.max(min, v)); }

        function formatNumber(n) { return n.toString().padStart(3, ' '); }

        // ============================================================
        //  ГЕНЕРАЦИЯ КАРТЫ
        // ============================================================
        function generateCard() {
            // 1. Редкость
            const rarity = weightedPick(RARITY_CONFIG);
            // 2. Число из диапазона
            const number = Math.floor(Math.random() * (rarity.max - rarity.min + 1)) + rarity.min;
            // 3. Звёзды
            const starObj = weightedPick(STAR_CONFIG);
            const stars = starObj.stars;

            return {
                number,
                rarity: rarity,
                stars: stars,
                isDuplicate: collection[number].found === true,
            };
        }

        // ============================================================
        //  ОТКРЫТИЕ ПАКА
        // ============================================================
        function openPack() {
            if (coins < 100) {
                shakeButton();
                return;
            }

            // Списываем монеты
            coins -= 100;
            updateUI();

            // Генерируем 3 карты
            const cards = [];
            let newCardsCount = 0;
            for (let i = 0; i < 3; i++) {
                const card = generateCard();
                cards.push(card);

                // Если не дубликат — добавляем в коллекцию
                if (!card.isDuplicate) {
                    collection[card.number].found = true;
                    collection[card.number].stars = card.stars;
                    newCardsCount++;
                } else {
                    // Дубликат: если у найденной карты меньше звёзд — обновляем (по желанию)
                    if (collection[card.number].stars < card.stars) {
                        collection[card.number].stars = card.stars;
                    }
                    // За дубликат даём 10 монет (утешительный приз)
                    coins += 10;
                }
            }

            // Партиклы (если есть новые карты)
            if (newCardsCount > 0) {
                spawnParticles();
            }

            // Отображаем карты
            displayCards(cards);

            // Обновляем UI
            updateUI();
            renderCollection();

            // Анимация кнопки
            packBtn.style.transform = 'scale(0.95)';
            setTimeout(() => { packBtn.style.transform = ''; }, 150);
        }

        // ============================================================
        //  ОТОБРАЖЕНИЕ КАРТ
        // ============================================================
        function displayCards(cards) {
            // Очищаем слоты
            slots.forEach(slot => {
                slot.innerHTML = '';
                slot.className = 'card-slot';
            });

            cards.forEach((card, idx) => {
                const slot = slots[idx];
                if (!slot) return;

                const cardEl = document.createElement('div');
                cardEl.className = `card ${card.rarity.css} reveal`;

                // Число
                const numEl = document.createElement('div');
                numEl.className = 'number';
                numEl.textContent = card.number;

                // Звёзды
                const starsEl = document.createElement('div');
                starsEl.className = 'stars';
                starsEl.textContent = '★'.repeat(card.stars) + '☆'.repeat(7 - card.stars);

                // Лейбл редкости
                const labelEl = document.createElement('div');
                labelEl.className = 'rarity-label';
                labelEl.textContent = card.rarity.name + (card.isDuplicate ? ' (дубль)' : '');

                // Если дубликат — делаем полупрозрачным
                if (card.isDuplicate) {
                    cardEl.style.opacity = '0.45';
                    cardEl.style.filter = 'grayscale(0.3)';
                }

                cardEl.appendChild(numEl);
                cardEl.appendChild(starsEl);
                cardEl.appendChild(labelEl);
                slot.appendChild(cardEl);
                slot.className = 'card-slot';

                // Задержка для каскадного эффекта
                cardEl.style.animationDelay = `${idx * 0.12}s`;
            });

            // Если карт меньше 3 (не бывает), заглушки
            for (let i = cards.length; i < 3; i++) {
                const slot = slots[i];
                if (slot) {
                    slot.innerHTML = '<span class="placeholder">✦</span>';
                    slot.className = 'card-slot';
                }
            }
        }

        // ============================================================
        //  ПАРТИКЛЫ (эффект открытия)
        // ============================================================
        function spawnParticles() {
            const colors = ['#f7d44a', '#ff6f00', '#ff3d00', '#d500f9', '#00e5ff', '#76ff03'];
            for (let i = 0; i < 40; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                const x = 40 + Math.random() * 20; // центр экрана %
                const y = 30 + Math.random() * 20;
                p.style.left = x + '%';
                p.style.top = y + '%';
                p.style.setProperty('--tx', (Math.random() - 0.5) * 600 + 'px');
                p.style.setProperty('--ty', (Math.random() - 0.5) * 600 + 'px');
                p.style.width = 4 + Math.random() * 8 + 'px';
                p.style.height = p.style.width;
                p.style.background = pickRandom(colors);
                p.style.boxShadow = `0 0 ${20 + Math.random() * 30}px ${p.style.background}`;
                p.style.animationDuration = 0.8 + Math.random() * 0.6 + 's';
                particleContainer.appendChild(p);
                setTimeout(() => p.remove(), 1500);
            }
        }

        // ============================================================
        //  ОБНОВЛЕНИЕ UI
        // ============================================================
        function updateUI() {
            coinsDisplay.textContent = coins.toLocaleString();

            const found = Object.values(collection).filter(c => c.found).length;
            collectionCount.textContent = `${found} / 100`;

            const pct = (found / 100) * 100;
            progressPercent.textContent = Math.round(pct) + '%';
            progressFill.style.width = pct + '%';

            // Кнопка доступна только если хватает монет
            packBtn.disabled = (coins < 100);
        }

        // ============================================================
        //  ОТРИСОВКА КОЛЛЕКЦИИ
        // ============================================================
        function renderCollection() {
            collectionGrid.innerHTML = '';
            for (let i = 1; i <= 100; i++) {
                const item = document.createElement('div');
                item.className = 'collection-item';
                if (collection[i].found) {
                    item.classList.add('found');
                    item.textContent = i;
                    // Показываем звёздочку, если есть
                    if (collection[i].stars > 0) {
                        const starMini = document.createElement('span');
                        starMini.className = 'star-mini';
                        starMini.textContent = '★'.repeat(collection[i].stars);
                        item.appendChild(starMini);
                    }
                } else {
                    item.textContent = '?';
                }
                // Редкий цвет фона по диапазону
                if (collection[i].found) {
                    const r = getRarityForNumber(i);
                    if (r) {
                        item.style.borderColor = r.color + '44';
                        item.style.boxShadow = `0 0 12px ${r.color}22`;
                    }
                }
                collectionGrid.appendChild(item);
            }
        }

        function getRarityForNumber(num) {
            for (let r of RARITY_CONFIG) {
                if (num >= r.min && num <= r.max) return r;
            }
            return null;
        }

        // ============================================================
        //  ЭФФЕКТ "ТРЯСКА" КНОПКИ
        // ============================================================
        function shakeButton() {
            packBtn.style.animation = 'shake 0.3s ease';
            setTimeout(() => { packBtn.style.animation = ''; }, 300);
        }

        // Добавляем keyframes для тряски
        const styleShake = document.createElement('style');
        styleShake.textContent = `
            @keyframes shake {
              0%, 100% { transform: translateX(0); }
              20% { transform: translateX(-12px); }
              40% { transform: translateX(12px); }
              60% { transform: translateX(-6px); }
              80% { transform: translateX(6px); }
            }
          `;
        document.head.appendChild(styleShake);

        // ============================================================
        //  ВКЛАДКИ (просто для вида)
        // ============================================================
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                // Пока просто перерисовываем коллекцию
                renderCollection();
            });
        });

        // ============================================================
        //  СОБЫТИЯ
        // ============================================================
        packBtn.addEventListener('click', openPack);

        // ============================================================
        //  ИНИЦИАЛИЗАЦИЯ
        // ============================================================
        updateUI();
        renderCollection();

        // Приветственная карта (пример)
        setTimeout(() => {
            const demoCard = {
                number: 42,
                rarity: RARITY_CONFIG[2], // Эпическая
                stars: 4,
                isDuplicate: false,
            };
            // Показываем демо-карту в первом слоте
            const slot = slots[0];
            if (slot) {
                const cardEl = document.createElement('div');
                cardEl.className = `card ${demoCard.rarity.css} reveal`;
                cardEl.style.animationDelay = '0.2s';
                const numEl = document.createElement('div');
                numEl.className = 'number';
                numEl.textContent = demoCard.number;
                const starsEl = document.createElement('div');
                starsEl.className = 'stars';
                starsEl.textContent = '★'.repeat(demoCard.stars) + '☆'.repeat(7 - demoCard.stars);
                const labelEl = document.createElement('div');
                labelEl.className = 'rarity-label';
                labelEl.textContent = 'Добро пожаловать!';
                cardEl.appendChild(numEl);
                cardEl.appendChild(starsEl);
                cardEl.appendChild(labelEl);
                slot.innerHTML = '';
                slot.appendChild(cardEl);
                slot.className = 'card-slot';
            }
        }, 300);

        // Периодический "дрейф" карточек в коллекции (микро-анимация)
        console.log('🚀 Number Collector готов!');
        console.log('💡 Открывай паки, собирай числа от 1 до 100!');
        console.log('✨ Редкости: Обычная → Редкая → Эпическая → Легендарная → Мифическая → Космическая');
    </script>

</body>
</html>
