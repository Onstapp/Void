<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Number Collector — Карточная игра</title>
    <style>
        /* ===== RESET & FULLSCREEN ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        :root {
            --gold: #f7d44a;
            --bg-start: #0a0e1a;
            --bg-end: #1a1040;
        }

        body {
            font-family: 'Orbitron', sans-serif;
            background: var(--bg-start);
            color: #fff;
            min-height: 100vh;
            min-height: 100dvh;
            background-image:
                radial-gradient(ellipse at 20% 30%, #1a2a5a 0%, #0a0e1a 60%),
                radial-gradient(ellipse at 80% 70%, #2a0a3a 0%, #0a0e1a 60%);
            background-attachment: fixed;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: pan-y;
        }

        /* ===== ЗВЁЗДНЫЙ ФОН ===== */
        .stars-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .star-bg {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite alternate;
        }

        @keyframes twinkle {
            0% {
                opacity: 0.15;
                transform: scale(0.8);
            }
            100% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        /* ===== ОСНОВНОЙ КОНТЕЙНЕР (полный экран) ===== */
        .game-container {
            position: relative;
            z-index: 1;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            padding: 16px 20px 20px;
            max-width: 500px;
            margin: 0 auto;
        }

        /* ===== ШАПКА ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            padding: 8px 4px 12px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .logo {
            font-size: 18px;
            font-weight: 900;
            background: linear-gradient(135deg, #f7d44a, #f9a825);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(247, 212, 74, 0.2);
            letter-spacing: 1px;
        }

        .logo small {
            font-size: 10px;
            -webkit-text-fill-color: rgba(255, 255, 255, 0.25);
            font-weight: 400;
            margin-left: 4px;
        }

        .stats {
            display: flex;
            gap: 14px;
        }

        .stat-item {
            text-align: center;
            background: rgba(0, 0, 0, 0.4);
            padding: 4px 14px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(8px);
        }

        .stat-item .label {
            font-size: 8px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: rgba(255, 255, 255, 0.3);
        }

        .stat-item .value {
            font-size: 18px;
            font-weight: 700;
            line-height: 1.2;
        }

        .stat-item .value.gold {
            color: var(--gold);
        }

        /* ===== ПРОГРЕСС ===== */
        .progress-wrapper {
            flex-shrink: 0;
            margin-bottom: 12px;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.3);
            margin-bottom: 4px;
        }

        .progress-track {
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.5);
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            border-radius: 20px;
            background: linear-gradient(90deg, #f7d44a, #f9a825, #ff6f00);
            box-shadow: 0 0 30px rgba(247, 212, 74, 0.2);
            transition: width 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* ===== КНОПКА ОТКРЫТИЯ ===== */
        .pack-btn-wrap {
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            margin-bottom: 12px;
        }

        .pack-btn {
            position: relative;
            background: linear-gradient(135deg, #2a3a6a, #1a2340);
            border: none;
            padding: 14px 40px;
            border-radius: 60px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 16px;
            color: #fff;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 6px 0 #0b0e1a, 0 10px 40px rgba(0, 0, 0, 0.5);
            transition: all 0.08s linear;
            text-transform: uppercase;
            border: 1px solid rgba(255, 255, 255, 0.06);
            width: 100%;
            max-width: 320px;
            touch-action: manipulation;
        }

        .pack-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), transparent 60%);
            pointer-events: none;
            border-radius: 60px;
        }

        .pack-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #0b0e1a, 0 8px 30px rgba(0, 0, 0, 0.5);
        }

        .pack-btn:disabled {
            opacity: 0.25;
            transform: translateY(4px);
            box-shadow: 0 2px 0 #0b0e1a;
            pointer-events: none;
        }

        .pack-btn .price-tag {
            font-size: 12px;
            font-weight: 400;
            color: var(--gold);
            margin-left: 8px;
        }

        /* ===== КАРТА (полноэкранный просмотр) ===== */
        .card-viewer {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 0;
            position: relative;
            perspective: 1000px;
            touch-action: pan-y;
        }

        .card-display {
            width: 100%;
            max-width: 320px;
            aspect-ratio: 5 / 7;
            position: relative;
            border-radius: 28px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1),
                opacity 0.4s ease,
                box-shadow 0.5s ease;
            opacity: 0;
            transform: scale(0.7) rotateY(30deg) translateZ(-100px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7);
            touch-action: pan-y;
            cursor: grab;
        }

        .card-display.active {
            opacity: 1;
            transform: scale(1) rotateY(0deg) translateZ(0);
        }

        .card-display .number {
            font-size: 80px;
            font-weight: 900;
            line-height: 1;
            text-shadow: 0 4px 40px rgba(0, 0, 0, 0.7);
            z-index: 2;
            position: relative;
        }

        .card-display .stars {
            font-size: 26px;
            letter-spacing: 5px;
            margin-top: 8px;
            z-index: 2;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.2);
        }

        .card-display .rarity-label {
            position: absolute;
            bottom: 18px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 3px;
            opacity: 0.5;
            background: rgba(0, 0, 0, 0.5);
            padding: 6px 20px;
            border-radius: 40px;
            backdrop-filter: blur(8px);
            z-index: 2;
        }

        .card-display .duplicate-badge {
            position: absolute;
            top: 14px;
            right: 14px;
            font-size: 10px;
            background: rgba(0, 0, 0, 0.6);
            padding: 4px 14px;
            border-radius: 30px;
            backdrop-filter: blur(4px);
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 1px;
            z-index: 2;
        }

        /* ===== ЦВЕТА РЕДКОСТИ ===== */
        .rarity-common {
            background: linear-gradient(145deg, #3a3f4a, #2a2e38);
            border-color: rgba(180, 180, 190, 0.15);
        }
        .rarity-common .number {
            color: #b0b5c0;
        }
        .rarity-common .stars {
            color: #b0b5c0;
        }

        .rarity-rare {
            background: linear-gradient(145deg, #1e4a2a, #0f2a18);
            border-color: rgba(46, 204, 113, 0.2);
            box-shadow: 0 0 60px rgba(46, 204, 113, 0.1);
        }
        .rarity-rare .number {
            color: #2ecc71;
        }
        .rarity-rare .stars {
            color: #2ecc71;
        }

        .rarity-epic {
            background: linear-gradient(145deg, #1a2a5a, #0c1840);
            border-color: rgba(52, 152, 219, 0.2);
            box-shadow: 0 0 70px rgba(52, 152, 219, 0.1);
        }
        .rarity-epic .number {
            color: #3498db;
        }
        .rarity-epic .stars {
            color: #3498db;
        }

        .rarity-legendary {
            background: linear-gradient(145deg, #4a3a0a, #2a2000);
            border-color: rgba(241, 196, 15, 0.2);
            box-shadow: 0 0 100px rgba(241, 196, 15, 0.15);
            animation: legendaryPulse 2.5s ease-in-out infinite;
        }
        .rarity-legendary .number {
            color: #f1c40f;
        }
        .rarity-legendary .stars {
            color: #f1c40f;
        }

        .rarity-mythic {
            background: linear-gradient(145deg, #4a0a1a, #2a0008);
            border-color: rgba(231, 76, 60, 0.2);
            box-shadow: 0 0 120px rgba(231, 76, 60, 0.15);
            animation: mythicPulse 1.8s ease-in-out infinite;
        }
        .rarity-mythic .number {
            color: #e74c3c;
        }
        .rarity-mythic .stars {
            color: #e74c3c;
        }

        .rarity-cosmic {
            background: linear-gradient(145deg, #2a0a3a, #14001f);
            border-color: rgba(155, 89, 182, 0.25);
            box-shadow: 0 0 160px rgba(155, 89, 182, 0.2);
            animation: cosmicPulse 1.5s ease-in-out infinite;
        }
        .rarity-cosmic .number {
            color: #bb77dd;
            text-shadow: 0 0 60px rgba(155, 89, 182, 0.5);
        }
        .rarity-cosmic .stars {
            color: #bb77dd;
        }

        @keyframes legendaryPulse {
            0%,
            100% {
                box-shadow: 0 0 60px rgba(241, 196, 15, 0.1);
            }
            50% {
                box-shadow: 0 0 120px rgba(241, 196, 15, 0.3);
            }
        }

        @keyframes mythicPulse {
            0%,
            100% {
                box-shadow: 0 0 80px rgba(231, 76, 60, 0.1);
            }
            50% {
                box-shadow: 0 0 160px rgba(231, 76, 60, 0.35);
            }
        }

        @keyframes cosmicPulse {
            0%,
            100% {
                box-shadow: 0 0 100px rgba(155, 89, 182, 0.15);
                transform: scale(1);
            }
            50% {
                box-shadow: 0 0 200px rgba(155, 89, 182, 0.4);
                transform: scale(1.01);
            }
        }

        /* ===== ИНДИКАТОР СВАЙПА ===== */
        .swipe-hint {
            position: absolute;
            bottom: -20px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.15);
            letter-spacing: 2px;
            animation: bounceHint 2s ease-in-out infinite;
            text-transform: uppercase;
            z-index: 5;
        }

        @keyframes bounceHint {
            0%,
            100% {
                transform: translateY(0);
                opacity: 0.15;
            }
            50% {
                transform: translateY(-6px);
                opacity: 0.4;
            }
        }

        .swipe-hint.hidden {
            opacity: 0;
            animation: none;
        }

        /* ===== ПАРТИКЛЫ ===== */
        .particle-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            animation: particleFly 1.4s ease-out forwards;
        }

        @keyframes particleFly {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1) rotate(0deg);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(0) rotate(720deg);
            }
        }

        /* ===== КОЛЛЕКЦИЯ (вкладка) ===== */
        .collection-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            padding-top: 4px;
        }

        .collection-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            padding: 8px 4px 10px;
        }

        .collection-title {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.5);
        }

        .collection-close {
            background: rgba(255, 255, 255, 0.06);
            border: none;
            color: rgba(255, 255, 255, 0.4);
            padding: 6px 16px;
            border-radius: 30px;
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 1px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .collection-close:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .collection-grid {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            overflow-y: auto;
            padding: 4px 2px 10px;
            align-content: start;
        }

        .collection-grid::-webkit-scrollbar {
            width: 3px;
        }
        .collection-grid::-webkit-scrollbar-track {
            background: transparent;
        }
        .collection-grid::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
        }

        /* ===== КАРТОЧКИ В КОЛЛЕКЦИИ ===== */
        .collection-card {
            aspect-ratio: 5 / 6;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 8px;
            position: relative;
            transition: all 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.04);
            min-height: 70px;
        }

        .collection-card.found {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.06);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .collection-card.found .col-number {
            font-size: 28px;
            font-weight: 900;
        }

        .collection-card.found .col-stars {
            font-size: 12px;
            letter-spacing: 2px;
            margin-top: 2px;
        }

        .collection-card:not(.found) {
            background: rgba(255, 255, 255, 0.02);
            border-color: rgba(255, 255, 255, 0.02);
        }

        .collection-card:not(.found) .col-number {
            font-size: 20px;
            color: rgba(255, 255, 255, 0.06);
        }

        .collection-card .col-number {
            line-height: 1;
        }

        .collection-card .col-stars {
            opacity: 0.5;
        }

        /* Цвета для карточек коллекции */
        .col-common .col-number {
            color: #b0b5c0;
        }
        .col-rare .col-number {
            color: #2ecc71;
        }
        .col-epic .col-number {
            color: #3498db;
        }
        .col-legendary .col-number {
            color: #f1c40f;
        }
        .col-mythic .col-number {
            color: #e74c3c;
        }
        .col-cosmic .col-number {
            color: #bb77dd;
        }

        /* ===== ВКЛАДКИ (переключатель) ===== */
        .mode-tabs {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
            margin-bottom: 6px;
        }

        .mode-tab {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.2);
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            padding: 6px 18px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            border: 1px solid transparent;
        }

        .mode-tab.active {
            color: #fff;
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.06);
        }

        .mode-tab:hover {
            color: rgba(255, 255, 255, 0.5);
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 420px) {
            .game-container {
                padding: 10px 12px 14px;
            }
            .card-display .number {
                font-size: 52px;
            }
            .card-display .stars {
                font-size: 18px;
                letter-spacing: 3px;
            }
            .card-display {
                max-width: 260px;
                padding: 14px;
            }
            .card-display .rarity-label {
                font-size: 9px;
                bottom: 12px;
                padding: 4px 14px;
            }
            .pack-btn {
                font-size: 13px;
                padding: 12px 24px;
            }
            .logo {
                font-size: 14px;
            }
            .stat-item .value {
                font-size: 14px;
            }
            .stat-item {
                padding: 3px 10px;
            }
            .collection-card.found .col-number {
                font-size: 20px;
            }
            .collection-card.found .col-stars {
                font-size: 9px;
            }
            .collection-grid {
                gap: 6px;
            }
        }

        @media (max-width: 360px) {
            .card-display .number {
                font-size: 40px;
            }
            .card-display {
                max-width: 200px;
                padding: 10px;
            }
            .card-display .stars {
                font-size: 14px;
                letter-spacing: 2px;
            }
        }

        @media (min-height: 800px) {
            .card-display {
                max-width: 360px;
            }
            .card-display .number {
                font-size: 96px;
            }
        }

        /* ===== HIDDEN ===== */
        .hidden {
            display: none !important;
        }

        /* ===== АНИМАЦИЯ КАРТЫ ПРИ ПЕРЕХОДЕ ===== */
        .card-exit-left {
            transform: translateX(-80px) scale(0.8) rotateY(-15deg) !important;
            opacity: 0 !important;
        }

        .card-exit-right {
            transform: translateX(80px) scale(0.8) rotateY(15deg) !important;
            opacity: 0 !important;
        }

        .card-enter-left {
            transform: translateX(80px) scale(0.8) rotateY(15deg) !important;
            opacity: 0 !important;
        }

        .card-enter-right {
            transform: translateX(-80px) scale(0.8) rotateY(-15deg) !important;
            opacity: 0 !important;
        }

        /* ===== ПРЕДУПРЕЖДЕНИЕ ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(12px);
            padding: 12px 28px;
            border-radius: 40px;
            font-size: 13px;
            color: var(--gold);
            border: 1px solid rgba(255, 215, 0, 0.1);
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.4s ease, transform 0.4s ease;
            transform: translateX(-50%) translateY(20px);
            pointer-events: none;
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <!-- ЗВЁЗДНЫЙ ФОН -->
    <div class="stars-bg" id="starsBg"></div>

    <!-- ТОСТ -->
    <div class="toast" id="toast"></div>

    <!-- ПАРТИКЛЫ -->
    <div class="particle-container" id="particleContainer"></div>

    <!-- ====== ГЛАВНЫЙ КОНТЕЙНЕР ====== -->
    <div class="game-container" id="gameContainer">

        <!-- ШАПКА -->
        <div class="header">
            <div class="logo">
                ⟡ NUM<span style="font-weight:400;">COLL</span>
                <small>v1</small>
            </div>
            <div class="stats">
                <div class="stat-item">
                    <div class="label">Монеты</div>
                    <div class="value gold" id="coinsDisplay">1 000</div>
                </div>
                <div class="stat-item">
                    <div class="label">Собрано</div>
                    <div class="value" id="collectionCount">0/100</div>
                </div>
            </div>
        </div>

        <!-- ПРОГРЕСС -->
        <div class="progress-wrapper">
            <div class="progress-label">
                <span>Прогресс коллекции</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <!-- ВКЛАДКИ -->
        <div class="mode-tabs">
            <button class="mode-tab active" data-mode="pack">📦 Паки</button>
            <button class="mode-tab" data-mode="collection">📚 Коллекция</button>
        </div>

        <!-- ====== РЕЖИМ ПАКОВ ====== -->
        <div id="packMode" style="flex:1;display:flex;flex-direction:column;min-height:0;">
            <div class="pack-btn-wrap">
                <button class="pack-btn" id="packBtn">
                    🎴 Открыть пак
                    <span class="price-tag">⚡100</span>
                </button>
            </div>

            <div class="card-viewer" id="cardViewer">
                <div class="card-display" id="cardDisplay">
                    <div class="number" id="cardNumber">—</div>
                    <div class="stars" id="cardStars">★★★★★★★</div>
                    <div class="rarity-label" id="cardRarity">Ожидание</div>
                    <div class="duplicate-badge hidden" id="duplicateBadge">ДУБЛЬ</div>
                </div>
                <div class="swipe-hint" id="swipeHint">↕ Свайпни для следующей</div>
            </div>
        </div>

        <!-- ====== РЕЖИМ КОЛЛЕКЦИИ ====== -->
        <div id="collectionMode" class="collection-section hidden">
            <div class="collection-header">
                <span class="collection-title">📖 Все числа</span>
                <button class="collection-close" id="closeCollection">✕ Закрыть</button>
            </div>
            <div class="collection-grid" id="collectionGrid"></div>
        </div>

    </div>

    <script>
        // ============================================================
        //  ДАННЫЕ
        // ============================================================
        const RARITY_CONFIG = [
            { name: 'Обычная', min: 1, max: 20, chance: 0.50, css: 'rarity-common', color: '#b0b5c0',
            colClass: 'col-common' },
            { name: 'Редкая', min: 21, max: 40, chance: 0.25, css: 'rarity-rare', color: '#2ecc71',
            colClass: 'col-rare' },
            { name: 'Эпическая', min: 41, max: 60, chance: 0.13, css: 'rarity-epic', color: '#3498db',
            colClass: 'col-epic' },
            { name: 'Легендарная', min: 61, max: 80, chance: 0.07, css: 'rarity-legendary', color: '#f1c40f',
                colClass: 'col-legendary' },
            { name: 'Мифическая', min: 81, max: 95, chance: 0.04, css: 'rarity-mythic', color: '#e74c3c',
            colClass: 'col-mythic' },
            { name: 'Космическая', min: 96, max: 100, chance: 0.01, css: 'rarity-cosmic', color: '#bb77dd',
                colClass: 'col-cosmic' },
        ];

        const STAR_CONFIG = [
            { stars: 1, chance: 0.45 },
            { stars: 2, chance: 0.25 },
            { stars: 3, chance: 0.15 },
            { stars: 4, chance: 0.08 },
            { stars: 5, chance: 0.04 },
            { stars: 6, chance: 0.02 },
            { stars: 7, chance: 0.01 },
        ];

        // ============================================================
        //  СОСТОЯНИЕ
        // ============================================================
        let coins = 1000;
        let collection = {};
        let currentPack = [];
        let currentCardIndex = 0;
        let isOpening = false;
        let isViewingPack = false;
        let swipeDirection = null;
        let touchStartY = 0;
        let isDragging = false;

        for (let i = 1; i <= 100; i++) {
            collection[i] = { found: false, stars: 0 };
        }

        // ============================================================
        //  DOM
        // ============================================================
        const coinsDisplay = document.getElementById('coinsDisplay');
        const collectionCount = document.getElementById('collectionCount');
        const progressPercent = document.getElementById('progressPercent');
        const progressFill = document.getElementById('progressFill');
        const packBtn = document.getElementById('packBtn');
        const cardDisplay = document.getElementById('cardDisplay');
        const cardNumber = document.getElementById('cardNumber');
        const cardStars = document.getElementById('cardStars');
        const cardRarity = document.getElementById('cardRarity');
        const duplicateBadge = document.getElementById('duplicateBadge');
        const swipeHint = document.getElementById('swipeHint');
        const cardViewer = document.getElementById('cardViewer');
        const collectionGrid = document.getElementById('collectionGrid');
        const packMode = document.getElementById('packMode');
        const collectionMode = document.getElementById('collectionMode');
        const toast = document.getElementById('toast');
        const starsBg = document.getElementById('starsBg');
        const particleContainer = document.getElementById('particleContainer');

        // ============================================================
        //  ЗВЁЗДНЫЙ ФОН
        // ============================================================
        function createStars() {
            for (let i = 0; i < 120; i++) {
                const star = document.createElement('div');
                star.className = 'star-bg';
                const size = 1 + Math.random() * 2.5;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.setProperty('--duration', (2 + Math.random() * 4) + 's');
                star.style.animationDelay = (Math.random() * 5) + 's';
                star.style.opacity = 0.2 + Math.random() * 0.4;
                starsBg.appendChild(star);
            }
        }
        createStars();

        // ============================================================
        //  ВСПОМОГАТЕЛЬНЫЕ
        // ============================================================
        function randomFloat() { return Math.random(); }

        function weightedPick(choices) {
            let r = randomFloat();
            let cumulative = 0;
            for (let item of choices) {
                cumulative += item.chance;
                if (r <= cumulative) return item;
            }
            return choices[choices.length - 1];
        }

        function getRarityForNumber(num) {
            for (let r of RARITY_CONFIG) {
                if (num >= r.min && num <= r.max) return r;
            }
            return RARITY_CONFIG[0];
        }

        function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toast._hide);
            toast._hide = setTimeout(() => toast.classList.remove('show'), 2200);
        }

        // ============================================================
        //  ГЕНЕРАЦИЯ КАРТЫ
        // ============================================================
        function generateCard() {
            const rarity = weightedPick(RARITY_CONFIG);
            const number = Math.floor(Math.random() * (rarity.max - rarity.min + 1)) + rarity.min;
            const starObj = weightedPick(STAR_CONFIG);
            return {
                number,
                rarity,
                stars: starObj.stars,
                isDuplicate: collection[number].found === true,
            };
        }

        // ============================================================
        //  ОТКРЫТИЕ ПАКА (с задержками)
        // ============================================================
        async function openPack() {
            if (isOpening) return;
            if (coins < 100) {
                showToast('❌ Недостаточно монет!');
                shakeButton();
                return;
            }

            isOpening = true;
            packBtn.disabled = true;
            coins -= 100;
            updateUI();

            // Генерируем 3 карты
            currentPack = [];
            let newCount = 0;
            for (let i = 0; i < 3; i++) {
                const card = generateCard();
                currentPack.push(card);
                if (!card.isDuplicate) {
                    collection[card.number].found = true;
                    collection[card.number].stars = card.stars;
                    newCount++;
                } else {
                    if (collection[card.number].stars < card.stars) {
                        collection[card.number].stars = card.stars;
                    }
                    coins += 10;
                }
            }

            if (newCount > 0) spawnParticles();
            updateUI();
            renderCollection();

            // Показываем первую карту
            currentCardIndex = 0;
            isViewingPack = true;
            swipeHint.classList.remove('hidden');
            await showCardWithDelay(currentPack[0], 0);

            isOpening = false;
            packBtn.disabled = (coins < 100);
        }

        // ============================================================
        //  ПОКАЗ КАРТЫ С АНИМАЦИЕЙ
        // ============================================================
        async function showCardWithDelay(card, delayMs) {
            // Сброс
            cardDisplay.className = 'card-display';
            cardDisplay.style.transition = 'none';
            cardDisplay.classList.add('active');

            // Применяем редкость
            cardDisplay.className = `card-display ${card.rarity.css} active`;

            // Контент
            cardNumber.textContent = card.number;
            cardStars.textContent = '★'.repeat(card.stars) + '☆'.repeat(7 - card.stars);
            cardRarity.textContent = card.rarity.name;

            if (card.isDuplicate) {
                duplicateBadge.classList.remove('hidden');
                duplicateBadge.textContent = 'ДУБЛЬ +10';
            } else {
                duplicateBadge.classList.add('hidden');
            }

            // Анимация входа
            cardDisplay.style.transition = 'all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)';
            cardDisplay.style.opacity = '0';
            cardDisplay.style.transform = 'scale(0.6) rotateY(20deg) translateZ(-80px)';

            await sleep(100);
            requestAnimationFrame(() => {
                cardDisplay.style.opacity = '1';
                cardDisplay.style.transform = 'scale(1) rotateY(0deg) translateZ(0)';
            });

            await sleep(500);
        }

        // ============================================================
        //  СВАЙП / ПЕРЕХОД К СЛЕДУЮЩЕЙ КАРТЕ
        // ============================================================
        function nextCard(direction) {
            if (!isViewingPack) return;
            if (currentCardIndex >= currentPack.length - 1) {
                // Последняя карта — завершаем просмотр
                finishPackView();
                return;
            }

            const nextIdx = currentCardIndex + 1;
            const currentCard = currentPack[currentCardIndex];
            const nextCard = currentPack[nextIdx];

            // Анимация ухода текущей
            const exitClass = direction === 'up' ? 'card-exit-left' : 'card-exit-right';
            cardDisplay.classList.add(exitClass);

            setTimeout(async () => {
                // Показываем следующую
                currentCardIndex = nextIdx;
                await showCardWithDelay(nextCard, 0);

                // Если это последняя — меняем подсказку
                if (currentCardIndex >= currentPack.length - 1) {
                    swipeHint.textContent = '👆 Нажми для завершения';
                } else {
                    swipeHint.textContent = '↕ Свайпни для следующей';
                }
            }, 400);
        }

        function finishPackView() {
            isViewingPack = false;
            swipeHint.classList.add('hidden');
            // Показываем заглушку
            cardDisplay.className = 'card-display';
            cardDisplay.style.transition = 'all 0.4s ease';
            cardDisplay.style.opacity = '0';
            cardDisplay.style.transform = 'scale(0.8)';
            setTimeout(() => {
                cardNumber.textContent = '✦';
                cardStars.textContent = '☆☆☆☆☆☆☆';
                cardRarity.textContent = 'Готов к открытию';
                duplicateBadge.classList.add('hidden');
                cardDisplay.className = 'card-display';
                cardDisplay.style.opacity = '0.3';
                cardDisplay.style.transform = 'scale(0.95)';
            }, 300);
        }

        // ============================================================
        //  СОБЫТИЯ СВАЙПА (мышь + тач)
        // ============================================================
        let isSwiping = false;
        let swipeStartY = 0;

        cardViewer.addEventListener('touchstart', (e) => {
            if (!isViewingPack) return;
            const touch = e.touches[0];
            swipeStartY = touch.clientY;
            isSwiping = true;
        }, { passive: true });

        cardViewer.addEventListener('touchmove', (e) => {
            if (!isSwiping || !isViewingPack) return;
            const touch = e.touches[0];
            const deltaY = touch.clientY - swipeStartY;
            if (Math.abs(deltaY) > 50) {
                isSwiping = false;
                const direction = deltaY < 0 ? 'up' : 'down';
                nextCard(direction);
            }
        }, { passive: true });

        cardViewer.addEventListener('touchend', () => {
            isSwiping = false;
        }, { passive: true });

        // Клик на карту — тоже переход (для десктопа)
        cardViewer.addEventListener('click', () => {
            if (isViewingPack) {
                // Если есть следующая — переходим, иначе завершаем
                if (currentCardIndex < currentPack.length - 1) {
                    nextCard('up');
                } else {
                    finishPackView();
                }
            }
        });

        // ============================================================
        //  ПАРТИКЛЫ
        // ============================================================
        function spawnParticles() {
            const colors = ['#f7d44a', '#ff6f00', '#ff3d00', '#d500f9', '#00e5ff', '#76ff03', '#ffffff'];
            for (let i = 0; i < 50; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                const x = 20 + Math.random() * 60;
                const y = 20 + Math.random() * 60;
                p.style.left = x + '%';
                p.style.top = y + '%';
                p.style.setProperty('--tx', (Math.random() - 0.5) * 700 + 'px');
                p.style.setProperty('--ty', (Math.random() - 0.5) * 700 + 'px');
                const size = 3 + Math.random() * 8;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                const color = colors[Math.floor(Math.random() * colors.length)];
                p.style.background = color;
                p.style.boxShadow = `0 0 ${20 + Math.random() * 30}px ${color}`;
                p.style.animationDuration = 0.8 + Math.random() * 0.8 + 's';
                particleContainer.appendChild(p);
                setTimeout(() => p.remove(), 2000);
            }
        }

        // ============================================================
        //  ТРЯСКА КНОПКИ
        // ============================================================
        function shakeButton() {
            packBtn.style.animation = 'shake 0.4s ease';
            setTimeout(() => { packBtn.style.animation = ''; }, 400);
        }

        const styleShake = document.createElement('style');
        styleShake.textContent = `
            @keyframes shake {
              0%,100%{transform:translateX(0)}
              20%{transform:translateX(-10px)}
              40%{transform:translateX(10px)}
              60%{transform:translateX(-6px)}
              80%{transform:translateX(6px)}
            }
          `;
        document.head.appendChild(styleShake);

        // ============================================================
        //  ОБНОВЛЕНИЕ UI
        // ============================================================
        function updateUI() {
            coinsDisplay.textContent = coins.toLocaleString();
            const found = Object.values(collection).filter(c => c.found).length;
            collectionCount.textContent = `${found}/100`;
            const pct = (found / 100) * 100;
            progressPercent.textContent = Math.round(pct) + '%';
            progressFill.style.width = pct + '%';
            packBtn.disabled = (coins < 100 || isOpening);
        }

        // ============================================================
        //  КОЛЛЕКЦИЯ (карточками, 2 в ряд)
        // ============================================================
        function renderCollection() {
            collectionGrid.innerHTML = '';
            for (let i = 1; i <= 100; i++) {
                const card = document.createElement('div');
                const data = collection[i];
                const rarity = getRarityForNumber(i);

                if (data.found) {
                    card.className = `collection-card found ${rarity.colClass}`;
                    const numSpan = document.createElement('span');
                    numSpan.className = 'col-number';
                    numSpan.textContent = i;
                    card.appendChild(numSpan);

                    if (data.stars > 0) {
                        const starSpan = document.createElement('span');
                        starSpan.className = 'col-stars';
                        starSpan.textContent = '★'.repeat(data.stars);
                        starSpan.style.color = rarity.color;
                        card.appendChild(starSpan);
                    }
                    card.style.borderColor = rarity.color + '33';
                    card.style.boxShadow = `0 0 20px ${rarity.color}11`;
                } else {
                    card.className = 'collection-card';
                    const numSpan = document.createElement('span');
                    numSpan.className = 'col-number';
                    numSpan.textContent = '?';
                    card.appendChild(numSpan);
                }
                collectionGrid.appendChild(card);
            }
        }

        // ============================================================
        //  ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК
        // ============================================================
        document.querySelectorAll('.mode-tab').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.mode-tab').forEach(b => b.classList.remove('active'));
                this.classList.add('active');

                const mode = this.dataset.mode;
                if (mode === 'pack') {
                    packMode.classList.remove('hidden');
                    collectionMode.classList.add('hidden');
                } else {
                    packMode.classList.add('hidden');
                    collectionMode.classList.remove('hidden');
                    renderCollection();
                }
            });
        });

        document.getElementById('closeCollection').addEventListener('click', () => {
            document.querySelector('.mode-tab[data-mode="pack"]').click();
        });

        // ============================================================
        //  СОБЫТИЯ
        // ============================================================
        packBtn.addEventListener('click', openPack);

        // ============================================================
        //  ИНИЦИАЛИЗАЦИЯ
        // ============================================================
        updateUI();
        renderCollection();

        // Показываем приветственную карту
        setTimeout(() => {
            cardNumber.textContent = '42';
            cardStars.textContent = '★★★★☆☆☆';
            cardRarity.textContent = 'Эпическая';
            cardDisplay.className = 'card-display rarity-epic';
            cardDisplay.style.transition = 'all 0.6s ease';
            cardDisplay.style.opacity = '0.4';
            cardDisplay.style.transform = 'scale(0.95)';
            duplicateBadge.classList.add('hidden');
        }, 200);

        console.log('🌟 Number Collector v2 — карточная коллекция');
        console.log('🎴 Открывай паки, свайпай карты, собирай все числа!');
        console.log('✨ Редкости: Обычная → Редкая → Эпическая → Легендарная → Мифическая → Космическая');
    </script>

</body>
</html>
