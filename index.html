<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Числовой Коллекционер: Двойная Рулетка</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        body {
            background-color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            color: #e2e8f0;
        }
        .app-container {
            width: 100%;
            max-width: 1000px;
            background: #1e293b;
            border-radius: 32px;
            padding: 24px 28px 32px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8);
        }
        /* Tabs */
        .tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 28px;
            border-bottom: 1px solid #334155;
            padding-bottom: 12px;
        }
        .tab-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 1.2rem;
            font-weight: 600;
            padding: 10px 24px;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .tab-btn.active {
            background: #3b82f6;
            color: #f8fafc;
            box-shadow: 0 4px 14px rgba(59,130,246,0.4);
        }
        .tab-btn:hover:not(.active) {
            background: #334155;
            color: #e2e8f0;
        }
        .tab-content {
            display: none;
            animation: fade 0.2s ease;
        }
        .tab-content.active {
            display: block;
        }
        @keyframes fade { from { opacity: 0.4; } to { opacity: 1; } }

        /* Game panel */
        .main-display {
            background: #0f172a;
            border-radius: 28px;
            padding: 24px 20px 20px;
            margin-bottom: 24px;
            text-align: center;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.6);
        }
        .current-number {
            font-size: 6rem;
            font-weight: 800;
            letter-spacing: 2px;
            line-height: 1.1;
            transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
            color: #f1f5f9;
        }
        .current-number.pop {
            transform: scale(1.18);
        }
        .rarity-badge {
            display: inline-block;
            margin-top: 4px;
            padding: 6px 28px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1.2rem;
            background: #1e293b;
            border: 1px solid #334155;
            box-shadow: 0 0 16px rgba(255,255,255,0.02);
        }
        .game-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            justify-content: center;
            margin: 20px 0 18px;
        }
        .btn {
            background: #2d3b52;
            border: none;
            color: white;
            font-weight: 600;
            font-size: 1.1rem;
            padding: 14px 28px;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
            flex: 0 1 auto;
        }
        .btn-primary {
            background: #3b82f6;
            color: white;
            padding: 14px 42px;
            font-size: 1.3rem;
        }
        .btn-primary:disabled {
            opacity: 0.5;
            transform: scale(0.95);
            pointer-events: none;
        }
        .btn-primary:hover:not(:disabled) {
            background: #2563eb;
            transform: scale(1.02);
        }
        .btn-collect {
            background: #8b5cf6;
        }
        .btn-collect:hover {
            background: #7c3aed;
        }
        .btn:active { transform: scale(0.96); }

        /* Roulette windows */
        .roulette-pair {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 24px;
            justify-content: center;
            margin: 30px 0 16px;
        }
        .roulette-window {
            flex: 1 1 220px;
            min-width: 180px;
            background: #0f172a;
            border-radius: 24px;
            padding: 16px 0 10px;
            box-shadow: inset 0 4px 12px rgba(0,0,0,0.6);
            position: relative;
            overflow: hidden;
        }
        .roulette-window h4 {
            text-align: center;
            font-weight: 500;
            color: #94a3b8;
            letter-spacing: 1px;
            margin-bottom: 8px;
            font-size: 0.9rem;
            text-transform: uppercase;
        }
        .roulette-track {
            display: flex;
            gap: 0;
            transition: transform 2s cubic-bezier(0.1, 0.8, 0.1, 1);
            will-change: transform;
            padding: 8px 0;
        }
        .roulette-card {
            flex: 0 0 70px;
            height: 74px;
            background: #1e293b;
            margin: 0 6px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: 700;
            color: #f1f5f9;
            border: 2px solid #334155;
            transition: border 0.2s, box-shadow 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }
        .roulette-card.winner {
            border: 3px solid #fbbf24;
            box-shadow: 0 0 24px #fbbf24aa, 0 0 60px #fbbf2440;
        }
        .pointer {
            position: relative;
            width: 0;
            height: 0;
            margin: 4px auto 0;
            border-left: 16px solid transparent;
            border-right: 16px solid transparent;
            border-top: 22px solid #facc15;
            filter: drop-shadow(0 0 10px #fbbf24);
            z-index: 5;
        }

        /* History log */
        .history-box {
            background: #0f172a;
            border-radius: 20px;
            padding: 16px 18px;
            margin: 20px 0 8px;
            max-height: 160px;
            overflow-y: auto;
        }
        .history-box div {
            padding: 6px 8px;
            border-left: 4px solid #475569;
            margin-bottom: 4px;
            font-size: 0.9rem;
            background: #1e293b60;
            border-radius: 4px;
        }

        /* Collection grid */
        .collection-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 12px 0 20px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .collection-controls select {
            background: #1e293b;
            border: 1px solid #334155;
            color: #e2e8f0;
            padding: 10px 18px;
            border-radius: 40px;
            font-size: 1rem;
            cursor: pointer;
        }
        .collection-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
        }
        .collection-card {
            background: #1e293b;
            aspect-ratio: 1;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            font-weight: 700;
            border: 2px solid #334155;
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            text-shadow: 0 0 6px currentColor;
        }
        .collection-card:hover {
            transform: scale(1.04);
            border-color: #facc15;
        }

        /* rarity colors & glow */
        .rarity-common { color: #94a3b8; border-color: #64748b; text-shadow: 0 0 6px #94a3b880; }
        .rarity-uncommon { color: #60a5fa; border-color: #3b82f6; text-shadow: 0 0 12px #3b82f6aa; }
        .rarity-rare { color: #a78bfa; border-color: #8b5cf6; text-shadow: 0 0 16px #8b5cf6aa; }
        .rarity-epic { color: #fbbf24; border-color: #f59e0b; text-shadow: 0 0 20px #fbbf24cc; }
        .rarity-legendary { color: #f97316; border-color: #ea580c; text-shadow: 0 0 28px #f97316dd; }
        .rarity-mythic { color: #ef4444; border-color: #dc2626; text-shadow: 0 0 40px #ef4444ee; animation: pulse-glow 2s infinite; }
        @keyframes pulse-glow {
            0% { text-shadow: 0 0 20px #ef4444; }
            50% { text-shadow: 0 0 60px #ef4444, 0 0 100px #ef444466; }
            100% { text-shadow: 0 0 20px #ef4444; }
        }
        .mythic-card {
            animation: pulse-glow 2s infinite;
        }
        .rarity-badge.rarity-common { background: #334155; color: #94a3b8; }
        .rarity-badge.rarity-uncommon { background: #1e3a5f; color: #60a5fa; }
        .rarity-badge.rarity-rare { background: #2e1f4a; color: #a78bfa; }
        .rarity-badge.rarity-epic { background: #3b2b0f; color: #fbbf24; }
        .rarity-badge.rarity-legendary { background: #3b1f0a; color: #f97316; }
        .rarity-badge.rarity-mythic { background: #3b0f0f; color: #ef4444; }

        /* scroll */
        .history-box::-webkit-scrollbar { width: 6px; }
        .history-box::-webkit-scrollbar-track { background: #0f172a; border-radius: 10px; }
        .history-box::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }

        @media (max-width: 600px) {
            .app-container { padding: 16px; }
            .current-number { font-size: 4rem; }
            .roulette-card { flex: 0 0 56px; height: 60px; font-size: 1.4rem; }
        }
    </style>
</head>
<body>
<div class="app-container" id="app">
    <!-- Tabs -->
    <div class="tabs">
        <button class="tab-btn active" data-tab="game">🎮 Игра</button>
        <button class="tab-btn" data-tab="collection">📦 Коллекция</button>
    </div>

    <!-- GAME TAB -->
    <div id="tab-game" class="tab-content active">
        <div class="main-display">
            <div class="current-number" id="currentNumber">1</div>
            <div class="rarity-badge" id="rarityBadge">Обычное</div>
        </div>

        <div class="game-actions">
            <button class="btn btn-primary" id="spinBtn">🎰 Испытать удачу</button>
            <button class="btn btn-collect" id="collectBtn">📥 В коллекцию</button>
        </div>

        <!-- Roulette pair -->
        <div class="roulette-pair">
            <div class="roulette-window">
                <h4>Рулетка А · Операция</h4>
                <div class="roulette-track" id="trackA" style="transform: translateX(0px);">
                    <!-- cards injected by js -->
                </div>
                <div class="pointer"></div>
            </div>
            <div class="roulette-window">
                <h4>Рулетка B · Число</h4>
                <div class="roulette-track" id="trackB" style="transform: translateX(0px);">
                    <!-- cards injected -->
                </div>
                <div class="pointer"></div>
            </div>
        </div>

        <!-- History -->
        <div class="history-box" id="historyLog">
            <div style="border-left-color: #475569; opacity:0.7;">📋 История ходов</div>
        </div>
    </div>

    <!-- COLLECTION TAB -->
    <div id="tab-collection" class="tab-content">
        <div class="collection-controls">
            <span style="font-weight:500;">Сохранённые числа</span>
            <select id="sortSelect">
                <option value="newest">Сначала новые</option>
                <option value="oldest">Сначала старые</option>
                <option value="max">По убыванию (Max)</option>
                <option value="min">По возрастанию (Min)</option>
                <option value="rarity">По редкости</option>
            </select>
        </div>
        <div class="collection-grid" id="collectionGrid"></div>
    </div>
</div>

<script>
    (function(){
        "use strict";

        // ---------- state ----------
        let currentNumber = 1;
        let history = [];            // массив строк
        let collection = [];         // массив чисел
        let spinInProgress = false;

        const trackA = document.getElementById('trackA');
        const trackB = document.getElementById('trackB');
        const currentNumberEl = document.getElementById('currentNumber');
        const rarityBadge = document.getElementById('rarityBadge');
        const historyLog = document.getElementById('historyLog');
        const spinBtn = document.getElementById('spinBtn');
        const collectBtn = document.getElementById('collectBtn');
        const collectionGrid = document.getElementById('collectionGrid');
        const sortSelect = document.getElementById('sortSelect');

        // ---------- helpers / rarity ----------
        function getRarity(n) {
            if (n === 777 || n === 666 || (n % 11 === 0 && n > 100)) return 'mythic';
            if (n >= 500) return 'legendary';
            if (n >= 150) return 'epic';
            if (n >= 50) return 'rare';
            if (n >= 20) return 'uncommon';
            return 'common';
        }
        function rarityLabel(r) {
            const map = { common:'Обычное', uncommon:'Редкое', rare:'Эпическое', epic:'Легендарное', legendary:'Легендарное', mythic:'Мифическое' };
            return map[r] || 'Обычное';
        }
        function rarityColorClass(r) {
            return 'rarity-'+r;
        }
        function getRarityInfo(n) {
            const r = getRarity(n);
            return { key: r, label: rarityLabel(r), class: rarityColorClass(r) };
        }

        // ---------- update display & history ----------
        function updateMainDisplay() {
            const info = getRarityInfo(currentNumber);
            currentNumberEl.textContent = currentNumber;
            currentNumberEl.className = 'current-number ' + info.class;
            rarityBadge.textContent = info.label;
            rarityBadge.className = 'rarity-badge ' + info.class;
            // pop effect
            currentNumberEl.classList.remove('pop');
            void currentNumberEl.offsetWidth;
            currentNumberEl.classList.add('pop');
            setTimeout(() => currentNumberEl.classList.remove('pop'), 200);
            saveState();
        }

        function addHistoryEntry(text, borderColor = '#475569') {
            history.push(text);
            if (history.length > 20) history.shift();
            renderHistory();
            saveState();
        }

        function renderHistory() {
            historyLog.innerHTML = '';
            history.forEach(line => {
                const div = document.createElement('div');
                div.textContent = line;
                // пытаемся найти цвет редкости в строке (после "=")
                const match = line.match(/=\s*(\d+)/);
                if (match) {
                    const num = parseInt(match[1], 10);
                    const info = getRarityInfo(num);
                    div.style.borderLeftColor = getComputedStyle(document.createElement('div')).color; // fallback
                    // назначаем цвет через класс
                    div.className = info.class;
                } else {
                    div.style.borderLeftColor = '#475569';
                }
                historyLog.appendChild(div);
            });
        }

        // ---------- collection render ----------
        function renderCollection() {
            const sortVal = sortSelect.value;
            let items = [...collection];
            if (sortVal === 'newest') items.reverse();
            else if (sortVal === 'oldest') { /* as is */ }
            else if (sortVal === 'max') items.sort((a,b)=>b-a);
            else if (sortVal === 'min') items.sort((a,b)=>a-b);
            else if (sortVal === 'rarity') {
                const order = { mythic:0, legendary:1, epic:2, rare:3, uncommon:4, common:5 };
                items.sort((a,b)=> (order[getRarity(a)] || 9) - (order[getRarity(b)] || 9) );
            }
            collectionGrid.innerHTML = '';
            items.forEach(num => {
                const info = getRarityInfo(num);
                const card = document.createElement('div');
                card.className = 'collection-card ' + info.class;
                if (info.key === 'mythic') card.classList.add('mythic-card');
                card.textContent = num;
                card.dataset.value = num;
                card.addEventListener('click', function(e) {
                    const val = parseInt(this.dataset.value, 10);
                    if (!isNaN(val)) {
                        currentNumber = val;
                        updateMainDisplay();
                        // switch tab to game
                        document.querySelector('[data-tab="game"]').click();
                    }
                });
                collectionGrid.appendChild(card);
            });
            saveState();
        }

        // ---------- save / load ----------
        function saveState() {
            try {
                localStorage.setItem('numCollectorState', JSON.stringify({
                    current: currentNumber,
                    history: history,
                    collection: collection
                }));
            } catch(e) {}
        }

        function loadState() {
            try {
                const raw = localStorage.getItem('numCollectorState');
                if (!raw) return false;
                const data = JSON.parse(raw);
                if (typeof data.current === 'number' && data.current >= 1) currentNumber = data.current;
                if (Array.isArray(data.history)) history = data.history.slice(0,20);
                if (Array.isArray(data.collection)) collection = data.collection;
                return true;
            } catch(e) { return false; }
        }

        // ---------- roulette cards generation ----------
        function generateCardsA() {
            const ops = ['+', '-', '*', '/'];
            let html = '';
            // повторим для длинной ленты
            for (let i=0; i<30; i++) {
                const op = ops[i % ops.length];
                html += `<div class="roulette-card" data-op="${op}">${op}</div>`;
            }
            trackA.innerHTML = html;
        }

        function generateCardsB() {
            // масштабируем модификаторы
            let maxMod = 5;
            if (currentNumber >= 100) maxMod = 20;
            else if (currentNumber >= 50) maxMod = 12;
            else if (currentNumber >= 20) maxMod = 8;
            else maxMod = 5;
            // для умножения лимит
            let html = '';
            const pool = [];
            for (let i=1; i<=maxMod; i++) pool.push(i);
            // добавим больше чисел для разнообразия
            while (pool.length < 20) {
                const extra = Math.floor(Math.random() * maxMod) + 1;
                pool.push(extra);
            }
            // перемешаем
            for (let i=pool.length-1; i>0; i--) {
                const j = Math.floor(Math.random()*(i+1));
                [pool[i], pool[j]] = [pool[j], pool[i]];
            }
            // лента из 30 карточек
            for (let i=0; i<30; i++) {
                const val = pool[i % pool.length];
                html += `<div class="roulette-card" data-num="${val}">${val}</div>`;
            }
            trackB.innerHTML = html;
        }

        // ---------- spin logic ----------
        function getRandomCardIndex(trackElement) {
            const cards = trackElement.querySelectorAll('.roulette-card');
            return Math.floor(Math.random() * cards.length);
        }

        function spinRoulette() {
            if (spinInProgress) return;
            spinInProgress = true;
            spinBtn.disabled = true;
            // сброс подсветки
            document.querySelectorAll('.roulette-card').forEach(c => c.classList.remove('winner'));

            // генерируем свежие карточки для B (зависит от currentNumber)
            generateCardsB();

            // Этап 1: крутим А
            const trackAW = trackA;
            const trackBW = trackB;
            const cardWidth = 70 + 12; // 70px card + 12px gap (margin 0 6 => 12)
            const totalWidth = trackAW.scrollWidth;
            // смещение чтобы центр был примерно на карточке
            const offsetA = - (getRandomCardIndex(trackAW) * cardWidth) - 20;
            trackAW.style.transition = 'transform 2s cubic-bezier(0.1, 0.8, 0.1, 1)';
            trackAW.style.transform = `translateX(${offsetA}px)`;

            // после завершения А запускаем В
            const onEndA = function() {
                trackAW.removeEventListener('transitionend', onEndA);
                // подсветка победителя А
                const idxA = Math.round(Math.abs(offsetA) / cardWidth) % trackAW.querySelectorAll('.roulette-card').length;
                const cardsA = trackAW.querySelectorAll('.roulette-card');
                if (cardsA[idxA]) cardsA[idxA].classList.add('winner');

                // Этап 2: крутим B
                const offsetB = - (getRandomCardIndex(trackBW) * cardWidth) - 20;
                trackBW.style.transition = 'transform 2s cubic-bezier(0.1, 0.8, 0.1, 1)';
                trackBW.style.transform = `translateX(${offsetB}px)`;

                const onEndB = function() {
                    trackBW.removeEventListener('transitionend', onEndB);
                    // подсветка победителя B
                    const idxB = Math.round(Math.abs(offsetB) / cardWidth) % trackBW.querySelectorAll('.roulette-card').length;
                    const cardsB = trackBW.querySelectorAll('.roulette-card');
                    if (cardsB[idxB]) cardsB[idxB].classList.add('winner');

                    // вычисляем результат
                    const opCard = trackAW.querySelector('.winner');
                    const numCard = trackBW.querySelector('.winner');
                    let op = '+';
                    let numMod = 1;
                    if (opCard) op = opCard.dataset.op || '+';
                    if (numCard) numMod = parseInt(numCard.dataset.num, 10) || 1;

                    let newVal = currentNumber;
                    let opSymbol = op;
                    if (op === '+') newVal = currentNumber + numMod;
                    else if (op === '-') newVal = Math.max(1, currentNumber - numMod);
                    else if (op === '*') {
                        let mult = Math.min(numMod, 3);
                        if (currentNumber > 100) mult = Math.min(mult, 2);
                        newVal = currentNumber * mult;
                    } else if (op === '/') {
                        newVal = Math.floor(currentNumber / Math.max(1, numMod));
                        if (newVal < 1) newVal = 1;
                    }
                    // защита от переполнения
                    if (newVal > 1e9) newVal = 1e9;
                    if (newVal < 1) newVal = 1;

                    const oldVal = currentNumber;
                    currentNumber = newVal;
                    updateMainDisplay();

                    const logMsg = `${oldVal} ${opSymbol} ${numMod} = ${newVal}`;
                    addHistoryEntry(logMsg, '#facc15');

                    spinInProgress = false;
                    spinBtn.disabled = false;
                };
                trackBW.addEventListener('transitionend', onEndB);
            };
            trackAW.addEventListener('transitionend', onEndA);
        }

        // ---------- collect ----------
        function collectNumber() {
            if (collection.includes(currentNumber)) {
                addHistoryEntry(`⚠️ Число ${currentNumber} уже есть в коллекции!`, '#f87171');
                return;
            }
            collection.push(currentNumber);
            addHistoryEntry(`📥 Сохранено: ${currentNumber}`, '#60a5fa');
            renderCollection();
            saveState();
        }

        // ---------- init UI ----------
        function initGameUI() {
            generateCardsA();
            generateCardsB();
            // позиционирование по центру (смещение)
            trackA.style.transform = 'translateX(-20px)';
            trackB.style.transform = 'translateX(-20px)';
            // загрузка состояния
            const loaded = loadState();
            if (loaded) {
                updateMainDisplay();
                renderHistory();
                renderCollection();
            } else {
                // по умолчанию
                currentNumber = 1;
                history = [];
                collection = [];
                updateMainDisplay();
                renderHistory();
                renderCollection();
            }
        }

        // ---------- tabs ----------
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const tabId = this.dataset.tab;
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
                document.getElementById('tab-'+tabId).classList.add('active');
                if (tabId === 'collection') renderCollection();
            });
        });

        // ---------- event listeners ----------
        spinBtn.addEventListener('click', spinRoulette);
        collectBtn.addEventListener('click', collectNumber);
        sortSelect.addEventListener('change', renderCollection);

        // ---------- start ----------
        initGameUI();

        // дополнительная защита: обновляем карточки B при изменении числа (но spin генерирует заново)
        // принудительно обновляем коллекцию при переключении
